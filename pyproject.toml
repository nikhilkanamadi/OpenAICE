[tool.poetry]
name = "openaice"
version = "0.1.0"
description = "OpenAICE — Auto Infrastructure Configuration Engine. An adapter-based, recommendation-first control plane for modern AI infrastructure."
authors = ["AutoInfraConfig Contributors"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "openaice"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5"
pyyaml = "^6.0"
fastapi = "^0.110"
uvicorn = {extras = ["standard"], version = "^0.27"}
click = "^8.1"
httpx = "^0.27"
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.3"

[tool.poetry.scripts]
openaice = "openaice.cli.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
