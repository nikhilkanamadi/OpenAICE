<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hexagon -->
  <polygon points="12,2 21,7 21,17 12,22 3,17 3,7" stroke-width="1.2" fill="none"/>
  <!-- Inner network nodes -->
  <circle cx="12" cy="8" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="7" cy="14" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="17" cy="14" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/>
  <!-- Connecting lines -->
  <line x1="12" y1="8" x2="7" y2="14" stroke-width="0.8"/>
  <line x1="12" y1="8" x2="17" y2="14" stroke-width="0.8"/>
  <line x1="7" y1="14" x2="17" y2="14" stroke-width="0.8"/>
  <line x1="7" y1="14" x2="12" y2="18" stroke-width="0.8"/>
  <line x1="17" y1="14" x2="12" y2="18" stroke-width="0.8"/>
  <!-- Center dot -->
  <circle cx="12" cy="13" r="1" fill="currentColor" stroke="none"/>
  <line x1="12" y1="8" x2="12" y2="13" stroke-width="0.8"/>
  <line x1="7" y1="14" x2="12" y2="13" stroke-width="0.8"/>
  <line x1="17" y1="14" x2="12" y2="13" stroke-width="0.8"/>
</svg>
