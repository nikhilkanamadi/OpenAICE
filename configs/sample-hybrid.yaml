# Sample configuration — Hybrid K8s + Slurm environment

prometheus:
  enabled: true
  url: http://localhost:9090

gpu_metrics:
  enabled: true
  prometheus_url: http://localhost:9090

kubernetes:
  enabled: true
  namespaces:
    - prod
    - ml-serving

slurm:
  enabled: true
  mode: mock
  mock_data_path: examples/telemetry-replay/slurm-node-health-warning/inputs/telemetry.yaml

generic_serving:
  enabled: true
  prometheus_url: http://localhost:9090

policy_mode: balanced
control_mode: observe_only

rules_path: policies/rules.yaml
policy_pack_path: policies/packs/balanced.yaml
api_port: 8000
