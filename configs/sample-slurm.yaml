# Sample configuration — Slurm / HPC environment

prometheus:
  enabled: true
  url: http://localhost:9090

gpu_metrics:
  enabled: true
  prometheus_url: http://localhost:9090

kubernetes:
  enabled: false

slurm:
  enabled: true
  mode: cli
  partitions:
    - gpu
    - compute
    - high-mem

policy_mode: fairness
control_mode: recommend_with_approval

objectives:
  latency: 0.10
  throughput: 0.25
  gpu_utilization: 0.30
  cost: 0.15
  reliability: 0.20

rules_path: policies/rules.yaml
policy_pack_path: policies/packs/balanced.yaml
api_port: 8000
